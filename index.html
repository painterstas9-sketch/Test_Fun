<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COPART GLOBAL // Virtual Auto Auction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        copartDark: '#121619',
                        copartCard: '#1a2026',
                        copartYellow: '#f59e0b',
                        copartRed: '#dc2626'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-copartDark text-zinc-100 min-h-screen flex flex-col">

    <!-- TOP BAR -->
    <header class="bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-yellow-500 text-black font-black px-3 py-1 rounded text-lg tracking-tighter">COPART</div>
                <span class="text-sm font-mono text-zinc-400">GLOBAL VIRTUAL AUCTION</span>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <span class="text-zinc-400 font-mono">Лотов онлайн: <strong class="text-yellow-500">0</strong></span>
                <button onclick="openAuthModal()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-4 py-1.5 rounded transition">Войти / Регистрация</button>
            </div>
        </div>
    </header>

    <!-- SEARCH & FILTER PANEL -->
    <section class="bg-copartCard border-b border-zinc-800 py-6">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-yellow-500 rounded-full animate-pulse"></span> Поиск по каталогу аукциона
            </h1>
            
            <!-- Сетка из 5 элементов в ряд -->
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input type="text" id="searchInput" placeholder="Марка, модель или № лота..." class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                
                <!-- 5 степеней повреждений -->
                <select id="damageFilter" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                    <option value="all">Все степени повреждений</option>
                    <option value="Новое / Без повреждений">Новое / Без повреждений</option>
                    <option value="Медиум / Царапины">Медиум / Царапины</option>
                    <option value="Тяжелые повреждения">Тяжелые повреждения</option>
                    <option value="Под восстановление">Под восстановление</option>
                    <option value="Тотал / Разрушен">Тотал / Разрушен</option>
                </select>

                <!-- Регионы: Европа, США, Азия -->
                <select id="locationFilter" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                    <option value="all">Все регионы</option>
                    <option value="Европа">Европа</option>
                    <option value="США">США</option>
                    <option value="Азия">Азия</option>
                </select>

                <!-- Кнопка Найти -->
                <button onclick="filterLots()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded px-4 py-2 text-sm transition shadow">
                    Найти
                </button>

                <!-- Кнопка Сбросить -->
                <button onclick="resetFilters()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded px-4 py-2 text-sm font-medium transition">
                    Сбросить
                </button>
            </div>
        </div>
    </section>

    <!-- LOTS TABLE / GRID -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="lotsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Динамические карточки лотов -->
        </div>
    </main>

    <!-- MODAL FOR CARS -->
    <div id="lotModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-copartCard border border-zinc-700 rounded-lg max-w-2xl w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-lg">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- AUTH MODAL WITH ERROR -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-copartCard border border-zinc-700 rounded-lg max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-lg">✕</button>
            <h2 class="text-xl font-bold text-white mb-4">Авторизация в системе торгов</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-zinc-400 mb-1">Email или ID участника</label>
                    <input type="text" id="authEmail" placeholder="user@example.com" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white w-full focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs font-mono text-zinc-400 mb-1">Пароль</label>
                    <input type="password" id="authPassword" placeholder="••••••••" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white w-full focus:outline-none focus:border-yellow-500">
                </div>

                <!-- Блок ошибки -->
                <div id="authError" class="hidden bg-red-950/60 border border-red-600/60 rounded p-3 text-xs text-red-300 font-mono leading-relaxed">
                    <strong>⚠️ Ошибка 403:</strong> Доступ к терминалу торгов заблокирован. Требуется верификация брокерского аккаунта США/Европа.
                </div>

                <button onclick="submitAuth()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black py-2.5 rounded text-sm font-bold transition">
                    Войти в систему
                </button>
            </div>
        </div>
    </div>

    <script>
        const lots = [];

        function renderLots(items) {
            const grid = document.getElementById('lotsGrid');
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-zinc-500 font-mono">Активных лотов на аукционе в данный момент нет.</div>`;
                return;
            }
        }

        function filterLots() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const damage = document.getElementById('damageFilter').value;
            const location = document.getElementById('locationFilter').value;

            const filtered = lots.filter(lot => {
                const matchesQuery = lot.title.toLowerCase().includes(query) || lot.id.toString().includes(query);
                const matchesDamage = damage === 'all' || lot.damage === damage;
                const matchesLocation = location === 'all' || lot.location === location;
                return matchesQuery && matchesDamage && matchesLocation;
            });

            renderLots(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('damageFilter').value = 'all';
            document.getElementById('locationFilter').value = 'all';
            renderLots(lots);
        }

        function openAuthModal() {
            document.getElementById('authError').classList.add('hidden');
            document.getElementById('authEmail').value = '';
            document.getElementById('authPassword').value = '';
            const modal = document.getElementById('authModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAuthModal() {
            const modal = document.getElementById('authModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function submitAuth() {
            const errorBlock = document.getElementById('authError');
            errorBlock.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('lotModal').classList.remove('flex');
            document.getElementById('lotModal').classList.add('hidden');
        }

        renderLots(lots);
    </script>
</body>
</html>
