<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COPART GLOBAL // Virtual Auto Auction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        copartDark: '#121619',
                        copartCard: '#1a2026',
                        copartYellow: '#f59e0b',
                        copartRed: '#dc2626'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .group:hover .gallery-controls { opacity: 1; }
    </style>
</head>
<body class="bg-copartDark text-zinc-100 min-h-screen flex flex-col">

    <!-- TOP BAR -->
    <header class="bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="bg-yellow-500 text-black font-black px-3 py-1 rounded text-lg tracking-tighter">COPART</div>
                <span class="text-sm font-mono text-zinc-400">GLOBAL VIRTUAL AUCTION</span>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <span class="text-zinc-400 font-mono">Лотов онлайн: <strong id="onlineCount" class="text-yellow-500">1</strong></span>
                <button onclick="openAuthModal()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-4 py-1.5 rounded transition">Войти / Регистрация</button>
            </div>
        </div>
    </header>

    <!-- SEARCH & FILTER PANEL -->
    <section class="bg-copartCard border-b border-zinc-800 py-6">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-yellow-500 rounded-full animate-pulse"></span> Поиск по каталогу аукциона
            </h1>
            
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input type="text" id="searchInput" placeholder="Марка, модель или № лота..." class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                
                <select id="damageFilter" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                    <option value="all">Все степени повреждений</option>
                    <option value="Новое / Без повреждений">Новое / Без повреждений</option>
                    <option value="Медиум / Царапины">Медиум / Царапины</option>
                    <option value="Тяжелые повреждения">Тяжелые повреждения</option>
                    <option value="Под восстановление">Под восстановление</option>
                    <option value="Тотал / Разрушен">Тотал / Разрушен</option>
                </select>

                <select id="locationFilter" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
                    <option value="all">Все регионы</option>
                    <option value="Европа">Европа</option>
                    <option value="США">США</option>
                    <option value="Азия">Азия</option>
                </select>

                <button onclick="filterLots()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded px-4 py-2 text-sm transition shadow">
                    Найти
                </button>

                <button onclick="resetFilters()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded px-4 py-2 text-sm font-medium transition">
                    Сбросить
                </button>
            </div>
        </div>
    </section>

    <!-- LOTS TABLE / GRID -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="lotsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Динамические карточки лотов -->
        </div>
    </main>

    <!-- AUTH MODAL WITH ERROR -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-copartCard border border-zinc-700 rounded-lg max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-lg">✕</button>
            <h2 class="text-xl font-bold text-white mb-4">Авторизация в системе торгов</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-zinc-400 mb-1">Email или ID участника</label>
                    <input type="text" id="authEmail" placeholder="user@example.com" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white w-full focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs font-mono text-zinc-400 mb-1">Пароль</label>
                    <input type="password" id="authPassword" placeholder="••••••••" class="bg-zinc-900 border border-zinc-700 rounded px-3 py-2 text-sm text-white w-full focus:outline-none focus:border-yellow-500">
                </div>

                <div id="authError" class="hidden bg-red-950/60 border border-red-600/60 rounded p-3 text-xs text-red-300 font-mono leading-relaxed">
                    <strong>⚠️ Ошибка 403:</strong> Доступ к терминалу торгов заблокирован. Требуется верификация брокерского аккаунта США/Европа.
                </div>

                <button onclick="submitAuth()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black py-2.5 rounded text-sm font-bold transition">
                    Войти в систему
                </button>
            </div>
        </div>
    </div>

    <script>
        const lots = [
            {
                id: 20244781,
                title: "2024 Renault Duster (Бензин, База)",
                damage: "Под восстановление",
                location: "Европа",
                odometer: "1,200 км",
                currentBid: "€14,200",
                pageUrl: "20244781.html",
                images: [
                    "Cars/Duster 2024 GAS/Pictures/1.png",
                    "Cars/Duster 2024 GAS/Pictures/2.png",
                    "Cars/Duster 2024 GAS/Pictures/3.png",
                    "Cars/Duster 2024 GAS/Pictures/4.png",
                    "Cars/Duster 2024 GAS/Pictures/5.png",
                    "Cars/Duster 2024 GAS/Pictures/6.png",
                    "Cars/Duster 2024 GAS/Pictures/7.png",
                    "Cars/Duster 2024 GAS/Pictures/8.png",
                    "Cars/Duster 2024 GAS/Pictures/9.png",
                    "Cars/Duster 2024 GAS/Pictures/10.png",
                    "Cars/Duster 2024 GAS/Pictures/11.png"
                ],
                currentIndex: 0
            }
        ];

        function renderLots(items) {
            const grid = document.getElementById('lotsGrid');
            grid.innerHTML = '';
            document.getElementById('onlineCount').innerText = items.length;

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-zinc-500 font-mono">По вашему запросу лотов не найдено.</div>`;
                return;
            }

            items.forEach(lot => {
                const card = document.createElement('div');
                card.className = "bg-copartCard border border-zinc-800 rounded-lg overflow-hidden hover:border-zinc-600 transition flex flex-col justify-between group cursor-pointer";
                card.onclick = () => { window.location.href = lot.pageUrl; };

                card.innerHTML = `
                    <div>
                        <div class="relative h-48 bg-zinc-900 overflow-hidden">
                            <img id="lot-img-${lot.id}" src="${lot.images[lot.currentIndex]}" class="w-full h-full object-cover transition duration-300" alt="${lot.title}">
                            <div class="absolute top-2 left-2 bg-black/80 px-2.5 py-1 rounded text-xs font-mono text-yellow-500 font-bold z-10 pointer-events-none">
                                Лот №: ${lot.id}
                            </div>
                            <div class="absolute top-2 right-2 bg-zinc-800/90 text-zinc-200 px-2.5 py-1 rounded text-xs font-bold font-mono z-10 pointer-events-none">
                                ${lot.location}
                            </div>
                            <div class="absolute bottom-2 right-2 bg-black/70 backdrop-blur-sm px-2 py-0.5 rounded text-[11px] font-mono text-zinc-300 z-10 pointer-events-none">
                                <span id="lot-counter-${lot.id}">${lot.currentIndex + 1}</span> / ${lot.images.length}
                            </div>
                            <div class="gallery-controls opacity-0 transition-opacity duration-200 absolute inset-0 flex items-center justify-between px-2">
                                <button onclick="event.stopPropagation(); changeImage(${lot.id}, -1)" class="bg-black/60 hover:bg-black/90 text-white w-8 h-8 rounded-full flex items-center justify-center transition text-sm font-bold shadow">❮</button>
                                <button onclick="event.stopPropagation(); changeImage(${lot.id}, 1)" class="bg-black/60 hover:bg-black/90 text-white w-8 h-8 rounded-full flex items-center justify-center transition text-sm font-bold shadow">❯</button>
                            </div>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-base mb-2 text-white">${lot.title}</h3>
                            <div class="space-y-1 text-xs text-zinc-400 font-mono">
                                <div>Степень повреждений: <span class="text-zinc-200">${lot.damage}</span></div>
                                <div>Пробег: <span class="text-zinc-200">${lot.odometer}</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 bg-zinc-900/50 border-t border-zinc-800 flex items-center justify-between" onclick="event.stopPropagation()">
                        <div>
                            <span class="text-[10px] text-zinc-500 uppercase block font-mono">Текущая цена</span>
                            <span class="text-lg font-bold font-mono text-yellow-500">${lot.currentBid}</span>
                        </div>
                        <a href="${lot.pageUrl}" class="bg-yellow-500 hover:bg-yellow-400 text-black px-4 py-2 rounded text-xs font-bold transition">
                            Сделать ставку
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function changeImage(lotId, direction) {
            const lot = lots.find(l => l.id === lotId);
            if (!lot) return;
            lot.currentIndex += direction;
            if (lot.currentIndex < 0) lot.currentIndex = lot.images.length - 1;
            if (lot.currentIndex >= lot.images.length) lot.currentIndex = 0;
            document.getElementById(`lot-img-${lotId}`).src = lot.images[lot.currentIndex];
            document.getElementById(`lot-counter-${lotId}`).innerText = lot.currentIndex + 1;
        }

        function filterLots() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const damage = document.getElementById('damageFilter').value;
            const location = document.getElementById('locationFilter').value;
            const filtered = lots.filter(lot => {
                const matchesQuery = lot.title.toLowerCase().includes(query) || lot.id.toString().includes(query);
                const matchesDamage = damage === 'all' || lot.damage === damage;
                const matchesLocation = location === 'all' || lot.location === location;
                return matchesQuery && matchesDamage && matchesLocation;
            });
            renderLots(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('damageFilter').value = 'all';
            document.getElementById('locationFilter').value = 'all';
            renderLots(lots);
        }

        function openAuthModal() {
            document.getElementById('authError').classList.add('hidden');
            const modal = document.getElementById('authModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('flex');
            document.getElementById('authModal').classList.add('hidden');
        }
        function submitAuth() {
            document.getElementById('authError').classList.remove('hidden');
        }

        renderLots(lots);
    </script>
</body>
</html>
